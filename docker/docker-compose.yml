version: '3.8'

services:
  solana-etl:
    build:
      context: ../../
      dockerfile: cmd/solana-etl/Dockerfile
    container_name: solana-etl
    restart: unless-stopped
    ports:
      - "20000:20000"  # Prometheus metrics
    environment:
      # Default configuration
      - WSS_URL=wss://api.mainnet-beta.solana.com
      - RPC_URL=https://api.mainnet-beta.solana.com
      - COMMITMENT=confirmed
      - EXPORTER=:20000
      - RPC_LIMIT_RATE=10
      - QUEUE_SIZE=2000
    command: >
      ./solana-etl start
      --mint-account="EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v,Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB"
      --verbose
      --exporter=:20000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:20000/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - solana-network

  # Optional: Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - solana-network
    profiles:
      - monitoring

  # Optional: Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - solana-network
    profiles:
      - monitoring

networks:
  solana-network:
    driver: bridge

volumes:
  grafana-storage:
